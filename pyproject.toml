[project]
name = "video-consumer"
version = "0.2.0"
description = "Turn a video into a transcript + screenshot digest package for agent consumption"
requires-python = ">=3.11"
dependencies = [
    "pillow>=10.0",
    "imagehash>=4.3",
]

[project.scripts]
video-consumer = "video_consumer.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
